<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BudgetWise</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0B1A2E;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.8s ease-in;
    }

    #splash-screen img {
      width: 280px;
      max-width: 80vw;
      height: auto;
      animation: pulse 2.2s ease-in-out infinite;
    }

    /* Barra de carga */
    .loading-bar-track {
      margin-top: 36px;
      width: 160px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: linear-gradient(90deg, #1E9FE0, #2DD4A7);
      animation: loading 1.3s ease-in-out infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    #app-content {
      display: none;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="logo.png" alt="BudgetWise">
    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>
  </div>

  <div id="app-content">
    <p>Aquí irá el contenido real de la app</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('splash-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    }, 2500);
  </script>

</body>
</html>
