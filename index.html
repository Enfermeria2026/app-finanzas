<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BudgetWise</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0B1A2E;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #splash-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-in;
    }

    #splash-screen img {
      width: 180px;
      height: 180px;
      animation: pulse 2s ease-in-out infinite;
    }

    #splash-screen h1 {
      margin-top: 20px;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 50%, #2DD4A7 75%, #1E9FE0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #splash-screen p {
      margin-top: 8px;
      font-size: 14px;
      color: #8A9BAE;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #app-content {
      display: none;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="logo.png" alt="BudgetWise">
    <h1>BudgetWise</h1>
    <p>Tu dinero, tu plan, tu futuro.</p>
  </div>

  <div id="app-content">
    <p>Aquí irá el contenido real de la app</p>
  </div>

  <script>
    // Tras 2.5 segundos, oculta la pantalla de carga y muestra la app
    setTimeout(() => {
      document.getElementById('splash-screen').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
    }, 2500);
  </script>

</body>
</html>
