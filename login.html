<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión - BudgetWise</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; overflow: hidden;    
    }

    .container {
      width: 100%; max-width: 400px; padding: 24px; display: flex; flex-direction: column;
      justify-content: center; max-height: 100vh; overflow-y: auto;  
      padding-bottom: 24px; animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .logo-header { text-align: center; margin-top: 0; margin-bottom: 30px; }
    .logo-header img { width: 200px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #0B1A2E; }
    p.subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 30px; }

    .input-group { position: relative; margin-bottom: 16px; }
    .input-group input { width: 100%; padding: 14px 44px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 14px; outline: none; }
    .input-group input:focus { border-color: #00A878; }
    .icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #00A878; width: 20px; }
    .icon-right { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #999; width: 20px; cursor: pointer; }

    .link-right { display: block; text-align: right; font-size: 13px; color: #00A878; text-decoration: none; margin-top: -8px; margin-bottom: 24px; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; }
    .btn-dark { background-color: #0B1A2E; margin-bottom: 24px; }

    .footer-link { text-align: center; font-size: 14px; color: #666; }
    .footer-link a { color: #00A878; text-decoration: none; font-weight: 600; }

    /* ESTILOS DE LA VENTANA EMERGENTE (MODAL) */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 26, 46, 0.7); display: none; 
      justify-content: center; align-items: center; z-index: 1000;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; opacity: 1; }
    .modal-box {
      background: white; width: 90%; max-width: 320px; padding: 24px;
      border-radius: 16px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-title { font-size: 18px; color: #0B1A2E; margin-bottom: 12px; font-weight: bold; }
    .modal-text { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    .modal-buttons { display: flex; gap: 12px; }
    .btn-modal { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
    .btn-primary { background: #00A878; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-header"><img src="logo_negro.png" alt="BudgetWise Logo"></div>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Bienvenido de nuevo. Nos alegra verte.</p>

    <!-- ICONO DE ARROBA PARA EL USUARIO -->
    <div class="input-group">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
      <input type="text" id="loginUsuario" placeholder="Nombre de usuario">
    </div>

    <div class="input-group">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <input type="password" id="loginPassword" placeholder="Contraseña">
      <!-- Añadido onclick para ver/ocultar contraseña -->
      <svg class="icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" onclick="togglePassword('loginPassword')"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </div>

    <a href="#" class="link-right">¿Olvidaste tu contraseña?</a>
    
    <button id="btnIniciarSesion" class="btn btn-dark">Iniciar sesión</button>

    <p class="footer-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>

  <!-- HTML DE LA VENTANA EMERGENTE -->
  <div id="miModal" class="modal-overlay">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title">Atención</div>
      <div id="modalText" class="modal-text">Mensaje</div>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJJsgp1RnXGqva04EuQEONEM9frfx-7I8",
      authDomain: "budgetwise-9608f.firebaseapp.com",
      projectId: "budgetwise-9608f",
      storageBucket: "budgetwise-9608f.firebasestorage.app",
      messagingSenderId: "438887897789",
      appId: "1:438887897789:web:1075b7b21577d1b632b5d4",
      measurementId: "G-E5XDC4BBPW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Elementos del Modal
    const modal = document.getElementById('miModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalButtons = document.getElementById('modalButtons');

    // Función para mostrar una alerta simple
    function mostrarAlerta(titulo, mensaje) {
      modalTitle.innerText = titulo;
      modalText.innerHTML = mensaje;
      modalButtons.innerHTML = `<button class="btn-modal btn-primary" onclick="cerrarModal()">Aceptar</button>`;
      modal.classList.add('active');
    }

    // Función global para cerrar el modal
    window.cerrarModal = function() {
      modal.classList.remove('active');
    }

    // Función global para ver/ocultar contraseñas
    window.togglePassword = function(id) {
      const input = document.getElementById(id);
      if (input.type === "password") {
        input.type = "text";
      } else {
        input.type = "password";
      }
    }

    const btnLogin = document.getElementById('btnIniciarSesion');

    btnLogin.addEventListener('click', async () => {
      const usuario = document.getElementById('loginUsuario').value.trim();
      const pass = document.getElementById('loginPassword').value;

      if (usuario === "" || pass === "") {
        mostrarAlerta("Faltan datos", "Por favor, rellena el usuario y la contraseña para iniciar sesión.");
        return;
      }

      // Ponemos el botón en estado de carga (feedback visual)
      btnLogin.innerText = "Comprobando...";
      btnLogin.disabled = true;

      try {
        const userRef = doc(db, "usuarios", usuario);
        const docSnap = await getDoc(userRef);

       if (docSnap.exists()) {
          const datosUsuario = docSnap.data();
          
          if (datosUsuario.password === pass) {
            
            // Guardamos quién ha iniciado sesión
            localStorage.setItem('usuarioLogueado', usuario);
            
            // EL PORTERO INTELIGENTE: ¿Ya hizo el tutorial?
            if (datosUsuario.tutorialCompletado === true) {
              // Si ya lo hizo, directo a sus cuentas
              window.location.href = "dashboard.html"; 
            } else {
              // Si no lo terminó o es la primera vez, al tutorial
              window.location.href = "tutorial.html"; 
            }

          } else {
            mostrarAlerta("Inicio de sesión fallido", "Usuario o contraseña es incorrecta.");
            btnLogin.innerText = "Iniciar sesión";
            btnLogin.disabled = false;
          }
      } catch (error) {
        mostrarAlerta("Error de conexión", "No se pudo conectar: " + error.message);
        btnLogin.innerText = "Iniciar sesión";
        btnLogin.disabled = false;
      }
    });
  </script>
</body>
</html>
