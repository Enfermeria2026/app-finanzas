<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Iniciar Sesión - BudgetWise</title>
  <!-- Enlaza el archivo manifest para que sea instalable -->
  <link rel="manifest" href="manifest.json">
  <!-- Le dice a los móviles de Apple que esto es una app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; 
      justify-content: center; 
      align-items: center; /* Alinea el contenido en el centro verticalmente */
      height: 100vh;       /* Fija la altura al 100% de la pantalla */
      overflow: hidden;    /* ¡LA MAGIA! Oculta cualquier scroll general de la ventana */
    }

    .container {
      width: 100%; 
      max-width: 400px; 
      padding: 24px; 
      display: flex; 
      flex-direction: column;
      justify-content: center; /* Centra el contenido si la pantalla es muy alta */
      
      /* Permite scroll SOLO DENTRO del contenedor si la pantalla del móvil es muy pequeña,
         pero no afecta a monitores o móviles grandes */
      max-height: 100vh; 
      overflow-y: auto;  
      
      /* Quita el padding-bottom exagerado que teníamos antes */
      padding-bottom: 24px; 
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .logo-header { 
      text-align: center; 
      margin-top: 0; /* ¡Aquí estaba el espacio sobrante! */
      margin-bottom: 30px; 
    }
    .logo-header img { width: 200px; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #0B1A2E; }
    p.subtitle { text-align: center; font-size: 14px; color: #666; margin-bottom: 30px; }

    .input-group { position: relative; margin-bottom: 16px; }
    .input-group input {
      width: 100%; padding: 14px 44px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 14px; outline: none;
    }
    .input-group input:focus { border-color: #00A878; }
    .icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #00A878; width: 20px; }
    .icon-right { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #999; width: 20px; cursor: pointer; }

    .link-right { display: block; text-align: right; font-size: 13px; color: #00A878; text-decoration: none; margin-top: -8px; margin-bottom: 24px; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; }
    .btn-dark { 
      background-color: #0B1A2E; 
      margin-bottom: 24px; /* Añade esto */
    }

    .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: #999; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #E0E0E0; }
    .divider::before { margin-right: 15px; } .divider::after { margin-left: 15px; }

    .social-buttons { display: flex; gap: 16px; margin-bottom: 24px; }
    .btn-social {
      flex: 1; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; background: white;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; cursor: pointer; gap: 8px;
    }

    .footer-link { text-align: center; font-size: 14px; color: #666; }
    .footer-link a { color: #00A878; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-header"><img src="logo_negro.png" alt="BudgetWise Logo"></div>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Bienvenido de nuevo. Nos alegra verte.</p>

    <!-- HE CAMBIADO A TEXTO Y AÑADIDO id="loginUsuario" -->
    <div class="input-group">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      <input type="text" id="loginUsuario" placeholder="Nombre de usuario">
    </div>

    <!-- HE AÑADIDO id="loginPassword" -->
    <div class="input-group">
      <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <input type="text" id="loginPassword" placeholder="Contraseña">
      <svg class="icon-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </div>

    <a href="#" class="link-right">¿Olvidaste tu contraseña?</a>
    
    <!-- HE AÑADIDO id="btnIniciarSesion" -->
    <button id="btnIniciarSesion" class="btn btn-dark">Iniciar sesión</button>

    <!-- Fíjate cómo el enlace ahora te lleva a registro.html -->
    <p class="footer-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>

  <!-- SCRIPT QUE COMPRUEBA EL USUARIO EN FIRESTORE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCJJsgp1RnXGqva04EuQEONEM9frfx-7I8",
      authDomain: "budgetwise-9608f.firebaseapp.com",
      projectId: "budgetwise-9608f",
      storageBucket: "budgetwise-9608f.firebasestorage.app",
      messagingSenderId: "438887897789",
      appId: "1:438887897789:web:1075b7b21577d1b632b5d4",
      measurementId: "G-E5XDC4BBPW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const btnLogin = document.getElementById('btnIniciarSesion');

    btnLogin.addEventListener('click', async () => {
      const usuario = document.getElementById('loginUsuario').value.trim();
      const pass = document.getElementById('loginPassword').value;

      if (usuario === "" || pass === "") {
        alert("Por favor, rellena el usuario y la contraseña.");
        return;
      }

      try {
        const userRef = doc(db, "usuarios", usuario);
        const docSnap = await getDoc(userRef);

        if (docSnap.exists()) {
          const datosUsuario = docSnap.data();
          
          if (datosUsuario.password === pass) {
            alert("¡Inicio de sesión correcto!");
            // Aquí puedes cambiar "dashboard.html" por la pantalla principal de tu app
            window.location.href = "dashboard.html"; 
          } else {
            alert("Contraseña incorrecta.");
          }
        } else {
          alert("El usuario no existe. Regístrate primero.");
        }
      } catch (error) {
        alert("Error de conexión: " + error.message);
      }
    });
  </script>
</body>
</html>
